[project]
name = "strmaction-backend"
version = "1.0.0"
description = "StrmAction - .strm 媒体库刮削、展示与播放分发"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "httpx>=0.27",
  "tenacity>=8.5",
  "argon2-cffi>=23.1",
  "pillow>=10.4",
  "apscheduler>=3.10",
  "rapidfuzz>=3.9",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
  "zhconv>=1.4",
  "guessit>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
include = ["app*"]
