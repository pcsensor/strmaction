<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StrmAction · 无法连接服务器</title>
  <style>
    :root {
      --accent: #e8b06a;
      --bg: #07080a;
      --card: #11151c;
      --line: rgba(255,255,255,.10);
      --text: #e8eaef;
      --muted: #8b94a7;
      --danger: #fda4af;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(1000px 520px at 50% -10%, rgba(232,176,106,.12), transparent 60%), var(--bg);
      color: var(--text);
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }
    .card {
      width: min(640px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 30px 80px -40px #000;
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .brand img { width: 42px; height: 42px; border-radius: 12px; }
    h1 { font-size: 20px; margin: 0; letter-spacing: -.02em; }
    p { color: var(--muted); font-size: 12.5px; margin: 10px 0 0; }
    .detail {
      margin: 20px 0 0;
      padding: 14px 16px;
      border: 1px solid rgba(253,164,175,.22);
      border-radius: 12px;
      background: rgba(253,164,175,.06);
      color: var(--danger);
      font-size: 12.5px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 52px;
    }
    .actions { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }
    button {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.06);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 15px;
      font: inherit;
      cursor: pointer;
    }
    button:hover { background: rgba(255,255,255,.11); }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #17120b;
      font-weight: 700;
    }
    button:disabled { opacity: .55; cursor: default; }
    .status { margin-top: 14px; min-height: 20px; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <img src="icon.png" alt="" onerror="this.style.display='none'">
      <div>
        <h1>无法连接服务器</h1>
        <p>StrmAction 已保留当前服务器地址，你可以重试或修改设置。</p>
      </div>
    </div>

    <div id="detail" class="detail">正在读取错误信息…</div>

    <div class="actions">
      <button id="retry" class="primary" type="button">重试</button>
      <button id="settings" type="button">服务器设置</button>
    </div>
    <div id="status" class="status"></div>
  </main>

  <script>
    const detail = document.getElementById('detail')
    const status = document.getElementById('status')
    const retry = document.getElementById('retry')
    const settings = document.getElementById('settings')
    let api = null
    let initialized = false

    function setStatus(text) {
      status.textContent = text || ''
    }

    async function init() {
      if (!window.pywebview || !window.pywebview.api) {
        detail.textContent = '桌面端桥接未就绪，请重启 StrmAction。'
        return
      }
      if (initialized) return
      initialized = true
      api = window.pywebview.api
      try {
        const result = await api.getConnectionError()
        detail.textContent = (result && result.error) || '无法连接服务器。'
      } catch (error) {
        detail.textContent = '读取错误信息失败：' + (error && error.message ? error.message : error)
      }
    }

    retry.addEventListener('click', async () => {
      if (!api) return
      retry.disabled = true
      settings.disabled = true
      setStatus('正在重新连接…')
      try {
        await api.retryConnection()
      } catch (error) {
        retry.disabled = false
        settings.disabled = false
        setStatus('重试失败：' + (error && error.message ? error.message : error))
      }
    })

    settings.addEventListener('click', async () => {
      if (!api) return
      settings.disabled = true
      setStatus('正在打开设置…')
      try {
        await api.openSettings()
      } catch (error) {
        settings.disabled = false
        setStatus('打开设置失败：' + (error && error.message ? error.message : error))
      }
    })

    window.addEventListener('pywebviewready', init)
    window.addEventListener('DOMContentLoaded', () => {
      if (window.pywebview && window.pywebview.api) init()
    })
  </script>
</body>
</html>
