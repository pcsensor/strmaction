<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StrmAction 桌面端设置</title>
  <style>
    :root {
      --accent: #e8b06a;
      --bg: #07080a;
      --card: #11151c;
      --line: rgba(255,255,255,.10);
      --text: #e8eaef;
      --muted: #8b94a7;
      --danger: #fda4af;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(1200px 600px at 50% -10%, rgba(232,176,106,.12), transparent 60%), var(--bg);
      color: var(--text);
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }
    .card {
      width: min(720px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 30px 80px -40px #000;
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
    .brand img { width: 42px; height: 42px; border-radius: 12px; }
    h1 { font-size: 20px; margin: 0; letter-spacing: -.02em; }
    .sub { color: var(--muted); font-size: 12px; margin: 0 0 24px; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 18px 0 7px; }
    input {
      width: 100%;
      background: #090c11;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px 13px;
      font: inherit;
      outline: none;
    }
    input:focus { border-color: rgba(232,176,106,.65); box-shadow: 0 0 0 3px rgba(232,176,106,.12); }
    button {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.06);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 15px;
      font: inherit;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover { background: rgba(255,255,255,.11); }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #17120b;
      font-weight: 700;
    }
    button.primary:hover { filter: brightness(1.05); }
    .actions { display: flex; gap: 10px; margin-top: 26px; flex-wrap: wrap; }
    .hint { color: var(--muted); font-size: 11.5px; margin-top: 10px; }
    .hint.danger { color: var(--danger); }
    .check {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 18px 0 0;
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
    }
    .check input {
      width: auto;
      margin: 0;
      accent-color: var(--accent);
    }
    .status { margin-top: 16px; min-height: 22px; font-size: 12.5px; }
    .status.ok { color: #86efac; }
    .status.err { color: var(--danger); }
    .meta { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 12px; color: var(--muted); font-size: 11.5px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <img src="icon.png" alt="" onerror="this.style.display='none'">
      <div>
        <h1>StrmAction 桌面端</h1>
        <p class="sub">原生硬件加速内嵌播放，进度自动双向同步。</p>
      </div>
    </div>

    <label for="server">服务器地址</label>
    <input id="server" type="url" placeholder="https://media.example.com" autocomplete="off" spellcheck="false">
    <p class="hint">必须带 http:// 或 https://；结尾的 / 可省略。</p>

    <label for="cache">预读缓存上限（MB）</label>
    <input id="cache" type="number" min="0" max="2048" step="16" inputmode="numeric" placeholder="128">
    <p class="hint">默认 128MB；0 表示使用系统默认缓冲，非 0 时按 16–2048MB 执行。</p>

    <label class="check" for="allowSelfSigned">
      <input id="allowSelfSigned" type="checkbox">
      <span>允许所有自签名 HTTPS 证书</span>
    </label>
    <p class="hint danger">
      开启后对 StrmAction、Alist、片源 CDN 等所有 HTTPS 连接跳过证书链和 hostname 校验。
      存在中间人风险。该设置需要在重启 StrmAction 后生效。
    </p>

    <div class="actions">
      <button id="save" class="primary" type="button">保存并打开</button>
      <button id="quit" type="button">退出</button>
    </div>
    <div id="status" class="status"></div>

    <div class="meta">
      版本 <span id="version">—</span> · 桌面端不会保存账号密码或网页 Cookie；登录在网页内完成。
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id)
    const server = $('server')
    const cache = $('cache')
    const allowSelfSigned = $('allowSelfSigned')
    const status = $('status')

    function getApi() {
      return (window.pywebview && window.pywebview.api) || window._strmaction_api || null
    }

    function setStatus(text, tone) {
      status.textContent = text || ''
      status.className = 'status' + (tone ? ' ' + tone : '')
    }

    let isInitialized = false

    async function init() {
      const api = getApi()
      if (!api) {
        return
      }
      if (isInitialized) return
      isInitialized = true

      try {
        const data = await api.get_settings()
        if (data) {
          server.value = data.server_url || ''
          cache.value = data.cache_limit_mb ?? 128
          allowSelfSigned.checked = !!data.allow_self_signed_https
          $('version').textContent = 'v' + (data.version || '?')
        }
      } catch (error) {
        setStatus('读取设置失败：' + (error && error.message ? error.message : error), 'err')
      }
    }

    $('save').addEventListener('click', async () => {
      const api = getApi()
      if (!api) {
        setStatus('桌面端桥接连接中，请稍后重试…', 'err')
        return
      }
      const value = server.value.trim()
      if (!/^https?:\/\//i.test(value)) {
        setStatus('服务器地址必须以 http:// 或 https:// 开头。', 'err')
        return
      }
      const cacheValue = Number(cache.value)
      if (!Number.isInteger(cacheValue) || cacheValue < 0 || cacheValue > 2048 ||
          (cacheValue > 0 && cacheValue < 16)) {
        setStatus('播放缓存上限必须是 0 或 16–2048 之间的整数（MB）。', 'err')
        return
      }
      setStatus('正在保存…')
      try {
        const result = await api.save_settings({
          server_url: value,
          cache_limit_mb: cacheValue,
          allow_self_signed_https: allowSelfSigned.checked,
        })
        if (result && result.ok && result.restart_required) {
          setStatus('已保存。需要重启 StrmAction 后生效。', 'ok')
        } else if (result && result.ok) {
          setStatus('已保存，正在打开网页…', 'ok')
        } else {
          setStatus((result && result.error) || '保存失败', 'err')
        }
      } catch (err) {
        setStatus('保存失败：' + (err && err.message ? err.message : err), 'err')
      }
    })

    $('quit').addEventListener('click', async () => {
      const api = getApi()
      if (api && api.quit) await api.quit()
    })

    window.addEventListener('strmaction:desktop-ready', init)
    window.addEventListener('pywebviewready', init)
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(init, 50)
    })
    // Periodic fallback probe in case events fire out of order
    const probe = setInterval(() => {
      if (getApi()) {
        init()
        clearInterval(probe)
      }
    }, 150)
  </script>
</body>
</html>
