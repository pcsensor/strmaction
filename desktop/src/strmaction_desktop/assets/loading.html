<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StrmAction · 正在连接</title>
  <style>
    :root {
      --accent: #e8b06a;
      --bg: #07080a;
      --text: #e8eaef;
      --muted: #8b94a7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(1000px 520px at 50% -10%, rgba(232,176,106,.12), transparent 60%), var(--bg);
      color: var(--text);
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }
    .card {
      width: min(560px, 100%);
      background: #11151c;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 20px;
      padding: 34px;
      text-align: center;
      box-shadow: 0 30px 80px -40px #000;
    }
    .brand { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 18px; }
    .brand img { width: 42px; height: 42px; border-radius: 12px; }
    h1 { font-size: 20px; margin: 0; letter-spacing: -.02em; }
    p { color: var(--muted); font-size: 12.5px; margin: 10px 0 0; }
    .spinner {
      width: 34px;
      height: 34px;
      margin: 24px auto 4px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,.14);
      border-top-color: var(--accent);
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <img src="icon.png" alt="" onerror="this.style.display='none'">
      <h1>StrmAction 桌面端</h1>
    </div>
    <div class="spinner" aria-hidden="true"></div>
    <p>正在连接服务器…</p>
  </main>
</body>
</html>
