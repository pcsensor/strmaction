[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strmaction-desktop"
version = "0.1.0"
description = "StrmAction desktop shell: WebView UI + local mpv playback + progress reporting"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.5",
  "pywebview>=5.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pillow>=10.0",
  "pyinstaller>=6.6",
]

[project.scripts]
strmaction-desktop = "strmaction_desktop.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
strmaction_desktop = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
